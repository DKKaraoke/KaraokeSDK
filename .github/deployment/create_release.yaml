name: Deploy to Release
on:
  push:

jobs:
  deploy:
    name: Create Release
    runs-on: ubuntu-20.04
    if: github.ref == 'refs/heads/' + ${{ github.event.repository.default_branch }}
    steps:
      - name: GitHub
        id: repository
        run: echo "name=${{ github.repository#${{ github.repository_owner }}/}}" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        if: ${{ github.event.head.user.login == 'act' }}
        run: |
          apt-get update
          apt-get install -y unzip zip jq
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and Build
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - name: Get Version
        id: current_version
        run: |
          echo "version=$(cat package.json | jq -r '.version')" >> $GITHUB_OUTPUT
      - name: Create ZIP
        run: |
          mkdir -p output
          mv dist ${{ steps.repository.outputs.name }}_${{ steps.current_version.outputs.version }}
          zip -r output/artifacts.zip ${{ steps.repository.outputs.name }}_${{ steps.current_version.outputs.version }}/
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.current_version.outputs.version }}
          release_name: v${{ steps.current_version.outputs.version }}
          draft: false
          prerelease: false
          commitish: ${{ github.event.repository.default_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: output/artifacts.zip
          asset_name: ${{ steps.repository.outputs.name }}_${{ steps.current_version.outputs.version }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
